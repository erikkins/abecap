<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1500px;height:500px;overflow:hidden;background:#F5F1E8}
:root{--paper:#F5F1E8;--paper-deep:#EDE7D8;--ink:#141210;--mute:#5A544E;--light:#8A8279;--claret:#7A2430;--rule:#DDD5C7;--rule-dk:#C9BFAC;--pos:#2D5F3F}
.banner{width:1500px;height:500px;background:var(--paper);position:relative;overflow:hidden;display:flex;align-items:stretch;font-family:'IBM Plex Sans',sans-serif}
.frame{position:absolute;inset:14px;border:1.5px solid var(--rule);pointer-events:none}
.left{width:60%;padding:52px 0 0 72px;position:relative}
.wordmark{font-family:'Fraunces',serif;font-weight:600;font-size:40px;letter-spacing:-1px;color:var(--ink)}
.wordmark .d{color:var(--claret)}
.kick{width:48px;height:3px;background:var(--claret);margin:64px 0 22px}
.hl{font-family:'Fraunces',serif;font-weight:600;color:var(--ink);letter-spacing:-1px;line-height:1.05;font-size:60px}
.hl .c{color:var(--claret)}
.sub{margin-top:22px;font-size:21px;color:var(--mute);line-height:1.45;max-width:560px}
.sub b{color:var(--ink);font-weight:600}
.url{position:absolute;top:52px;right:44px;z-index:5;font-family:'IBM Plex Mono',monospace;font-size:20px;font-weight:500;color:var(--claret)}
.viz{position:absolute;right:0;top:0;width:40%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:transparent}
.divider{position:absolute;left:60%;top:14px;bottom:14px;width:1px;background:var(--rule)}
.ends{display:flex;justify-content:space-between;width:330px;margin-top:14px}
.ends .t{font-family:'Fraunces',serif;font-size:21px;font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.ends .l .t{color:var(--pos)}.ends .r .t{color:var(--claret)}
.cap{font-family:'Fraunces',serif;font-style:italic;color:var(--mute);font-size:15px;margin-top:12px}
</style></head>
