<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,144,400;0,144,600;0,144,700;1,144,600;1,144,700&family=IBM+Plex+Mono:wght@400;500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: #F5F1E8; }
  /* RigaCap PAPER editorial system — matches the site + launch cards */
  :root {
    --paper: #F5F1E8; --ink: #141210; --muted: #5A544E; --faint: #8A8279;
    --claret: #7A2430; --oxblood: #8F2D3D; --forest: #2D5F3F; --hairline: #DDD5C7;
    --serif: "Fraunces", Georgia, serif;
    --sans: "IBM Plex Sans", -apple-system, Helvetica, sans-serif;
  }
  /* Everything critical lives inside a centered safe zone so X's link-card crop
     only ever eats the outer margins — never the wordmark or the numbers. */
  .card {
    width: 1200px; height: 630px; background: var(--paper); color: var(--ink);
    position: relative;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 0 140px;
  }
  .frame { position: absolute; inset: 24px; border: 1.5px solid var(--hairline); pointer-events: none; }

  .wordmark { font-family: var(--serif); font-weight: 600; font-size: 50px; letter-spacing: -1px; line-height: 1; }
  .wordmark .dot { color: var(--claret); }
  .kicker { width: 52px; height: 3px; background: var(--claret); margin: 20px 0 26px; }

  .headline { font-family: var(--serif); font-weight: 600; font-size: 52px; line-height: 1.06; }
  .headline em { font-style: italic; color: var(--claret); }

  .hero { font-family: var(--serif); font-weight: 700; font-size: 96px; line-height: 1; margin-top: 34px; color: var(--claret); }
  .hero .big { font-style: italic; }
  .hero .unit { font-style: normal; font-weight: 600; font-size: 58px; color: var(--ink); }
  .dd { font-family: var(--serif); font-weight: 600; font-size: 44px; color: var(--forest); margin-top: 14px; }

  .compare { font-family: var(--sans); font-weight: 500; font-size: 23px; color: var(--muted); margin-top: 22px; }
  .compare b { color: var(--ink); font-weight: 600; }
  .compare .neg { color: var(--oxblood); font-weight: 600; }

  .footer {
    position: absolute; left: 64px; right: 64px; bottom: 44px;
    display: flex; justify-content: space-between; align-items: center;
    font-family: var(--sans); font-size: 18px;
  }
  .footer .disc { color: var(--faint); font-weight: 500; }
  .footer .url { color: var(--muted); font-weight: 600; font-size: 20px; }
</style>
</head>
<body>
<div class="card">
  <div class="frame"></div>

  <div class="wordmark">RigaCap<span class="dot">.</span></div>
  <div class="kicker"></div>
  <div class="headline">Momentum, built around the <em>drawdown.</em></div>

  <div class="hero"><span class="big">+31%</span><span class="unit"> a year</span></div>
  <div class="dd">−15% worst drawdown</div>

  <div class="compare">
    Maximizer, 2021–2026 walk-forward. The S&amp;P returned <b>+14% a year</b> and fell <span class="neg">−25%</span>.
  </div>

  <div class="footer">
    <div class="disc">Signals only — execute via your broker</div>
    <div class="url">rigacap.com</div>
  </div>
</div>
</body>
</html>
